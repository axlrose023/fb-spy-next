default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        files: ^src/(app/(accounts|ad_library|browser|facebook)/|tests/(architecture|contracts|accounts|ad_library|browser|facebook)/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic]
        args: [
          --follow-imports=skip,
          --ignore-missing-imports,
        ]
        files: ^src/(app/(accounts|ad_library|browser|facebook)/|tests/(architecture|contracts|accounts|ad_library|browser|facebook)/)

  - repo: local
    hooks:
      - id: refactor-guardrails
        name: refactor architecture and contract guardrails
        entry: uv run pytest -q src/tests/architecture src/tests/contracts
        language: system
        pass_filenames: false
