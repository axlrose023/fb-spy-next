name: fastapi-template

services:
  app: &app
    build: .
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./storage:/app/storage
    ports:
      - "127.0.0.1:${APP__API__PORT}:${APP__API__PORT}"
    env_file:
      - .env
    environment:
      - APP__ENV=dev
      - APP__POSTGRES__HOST=db
      - APP__POSTGRES__PORT=5432
      - APP__REDIS__HOST=cache
      - APP__GEMINI__API_KEY=${APP__GEMINI__API_KEY:-}
      - APP__GEMINI__MODEL=${APP__GEMINI__MODEL:-gemini-2.5-flash}
      - APP__FACEBOOK__OCTO_HOST=${APP__FACEBOOK__OCTO_HOST:-host.docker.internal}
      - APP__FACEBOOK__RELEVANCE_FILTER_ENABLED=${APP__FACEBOOK__RELEVANCE_FILTER_ENABLED:-false}
      - APP__FACEBOOK__RELEVANCE_FILTER_TASKIQ_ENABLED=${APP__FACEBOOK__RELEVANCE_FILTER_TASKIQ_ENABLED:-true}
      - APP__FACEBOOK__RELEVANCE_FILTER_TASK_TIMEOUT_SECONDS=${APP__FACEBOOK__RELEVANCE_FILTER_TASK_TIMEOUT_SECONDS:-180}
      - APP__FACEBOOK__RELEVANCE_FILTER_TASK_RETRIES=${APP__FACEBOOK__RELEVANCE_FILTER_TASK_RETRIES:-1}
      - APP__FACEBOOK__LANDING_ARCHIVE_ENABLED=${APP__FACEBOOK__LANDING_ARCHIVE_ENABLED:-true}
      - APP__FACEBOOK__LANDING_ARCHIVE_TIMEOUT_SECONDS=${APP__FACEBOOK__LANDING_ARCHIVE_TIMEOUT_SECONDS:-20}
      - APP__FACEBOOK__LANDING_ARCHIVE_MAX_RESOURCES=${APP__FACEBOOK__LANDING_ARCHIVE_MAX_RESOURCES:-120}
      - APP__FACEBOOK__VIDEO_RECORDING_ENABLED=${APP__FACEBOOK__VIDEO_RECORDING_ENABLED:-true}
      - APP__FACEBOOK__VIDEO_RECORDING_MAX_SECONDS=${APP__FACEBOOK__VIDEO_RECORDING_MAX_SECONDS:-30}
      - APP__FACEBOOK__VIDEO_RECORDING_FPS=${APP__FACEBOOK__VIDEO_RECORDING_FPS:-8}
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null http://localhost:${APP__API__PORT}/ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy

  migrator:
    <<: *app
    command: [ cli, upgrade ]
    restart: "no"
    ports: []
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    <<: *app
    command: [ taskiq, scheduler, "app.tiq:scheduler", "app.tasks" ]
    ports: []
    healthcheck:
      disable: true

  tasks:
    <<: *app
    command: [ taskiq, worker, "app.tiq:broker", -w, "4", "--max-async-tasks", "1", "--max-prefetch", "1", "--ack-type", "when_executed", "--wait-tasks-timeout", "180", "app.tasks" ]
    ports: []
    healthcheck:
      disable: true

  emulation:
    build:
      context: .
      dockerfile: Dockerfile.emulation
    restart: unless-stopped
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - APP__ENV=dev
      - APP__POSTGRES__HOST=db
      - APP__POSTGRES__PORT=5432
      - APP__REDIS__HOST=cache
      - APP__PLAYWRIGHT__HEADLESS=false
      - DISPLAY=:99
    ports:
      - "127.0.0.1:5901:5900"
      - "127.0.0.1:6081:6080"
    depends_on:
      cache:
        condition: service_healthy

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 10s
      retries: 5

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP__POSTGRES__USER}
      POSTGRES_PASSWORD: ${APP__POSTGRES__PASSWORD}
      POSTGRES_DB: ${APP__POSTGRES__DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${APP__POSTGRES__PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${APP__POSTGRES__USER}" ]
      interval: 5s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - app

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    user: "root"

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
      - loki

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:
