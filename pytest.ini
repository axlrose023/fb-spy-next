[pytest]
asyncio_mode = auto
testpaths = src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers
markers =
    unit: pure or isolated behavior without external infrastructure
    contract: compatibility contract for an API, adapter, CLI, or schema
    integration: multiple application layers with local infrastructure
    browser: browser-bound test that may require Playwright
    smoke: explicitly invoked end-to-end smoke test
    architecture: static dependency, naming, and size guardrail
